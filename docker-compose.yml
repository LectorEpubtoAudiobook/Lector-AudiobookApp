services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.2
    restart: unless-stopped
    expose:
      - "8880"
    volumes:
      - kokoro-voices:/app/api/src/voices
    networks:
      - audiobook-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - kokoro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - APP_USERNAME=${APP_USERNAME}
      - APP_PASSWORD=${APP_PASSWORD}
      - KOKORO_URL=http://kokoro:8880
    volumes:
      - audiobook-books:/data/books
      - audiobook-audio:/data/audio
      - audiobook-db:/data/db
    networks:
      - audiobook-net

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - audiobook-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - audiobook-net

volumes:
  kokoro-voices:
  audiobook-books:
  audiobook-audio:
  audiobook-db:

networks:
  audiobook-net:
    driver: bridge